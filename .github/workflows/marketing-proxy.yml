name: Marketing Proxy

# Claude Code 웹 세션은 api.twitter.com / discord.com에 직접 접근할 수 없습니다.
# api.github.com은 허용되므로, repository_dispatch로 이 워크플로우를 트리거하면
# GitHub Actions 런너가 외부 API를 대신 호출합니다.

on:
  schedule:
    # 매일 KST 08:30, 20:30에 X 메트릭 자동 수집 (UTC 23:30, 11:30)
    - cron: "30 23 * * *"
    - cron: "30 11 * * *"
  repository_dispatch:
    types: [post-to-x, discord-notify, weekly-metrics]
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 잡 (daily-x-metrics 만 지원)"
        required: false
        default: "daily-x-metrics"
        type: choice
        options:
          - daily-x-metrics

jobs:
  post-to-x:
    if: github.event.action == 'post-to-x'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 트윗 발행
        id: post
        run: node scripts/marketing/post-to-x.js
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          TWEET_TEXT: ${{ github.event.client_payload.text }}

      - name: Discord 알림 (트윗 URL 포함)
        if: success() && steps.post.outputs.tweet_url != ''
        run: node scripts/marketing/discord-notify.js
        env:
          DISCORD_MARKETING_WEBHOOK: ${{ secrets.DISCORD_MARKETING_WEBHOOK }}
          DISCORD_USERNAME: "Social Media Marketer"
          DISCORD_TEXT: |
            X 포스트 발행 완료
            ${{ steps.post.outputs.tweet_url }}

            ${{ github.event.client_payload.text }}

  weekly-metrics:
    if: github.event.action == 'weekly-metrics'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.branch || 'develop' }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: GA4 트래픽 메트릭 수집
        run: node scripts/marketing/ga4-metrics.js --days 7 --type traffic > /tmp/ga4-traffic.csv
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}

      - name: GA4 유입 소스 수집
        run: node scripts/marketing/ga4-metrics.js --days 7 --type sources > /tmp/ga4-sources.csv
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}

      - name: X 트윗 메트릭 수집
        run: node scripts/marketing/x-metrics.js --user-id "${{ secrets.X_USER_ID }}" --count 30 > /tmp/x-metrics.csv
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}

      - name: 주간 메트릭 파일 생성 및 커밋
        run: |
          WEEK=$(date -u +%G-W%V)
          mkdir -p docs/metrics
          OUT="docs/metrics/weekly-${WEEK}.md"
          {
            echo "# 주간 메트릭 — ${WEEK}"
            echo ""
            echo "생성 시각: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "## GA4 트래픽 (최근 7일)"
            echo ""
            echo '```csv'
            cat /tmp/ga4-traffic.csv
            echo '```'
            echo ""
            echo "## GA4 유입 소스"
            echo ""
            echo '```csv'
            cat /tmp/ga4-sources.csv
            echo '```'
            echo ""
            echo "## X 트윗 메트릭"
            echo ""
            echo '```csv'
            cat /tmp/x-metrics.csv
            echo '```'
          } > "$OUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "[마케팅] 주간 메트릭 자동 수집 ${WEEK}"
            git push
          fi

  daily-x-metrics:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily-x-metrics')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: X 트윗 메트릭 수집
        run: |
          mkdir -p docs/metrics
          node scripts/marketing/x-metrics.js --user-id "${{ secrets.X_USER_ID }}" --count 20 > docs/metrics/daily-x-latest.csv
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_METRICS_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

      - name: 메트릭 파일 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/metrics/daily-x-latest.csv
          if git diff --cached --quiet; then
            echo "변경사항 없음"
          else
            git commit -m "[마케팅] X 메트릭 자동 수집 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

  discord-notify:
    if: github.event.action == 'discord-notify'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Discord 알림
        run: node scripts/marketing/discord-notify.js
        env:
          DISCORD_MARKETING_WEBHOOK: ${{ secrets.DISCORD_MARKETING_WEBHOOK }}
          DISCORD_TEXT: ${{ github.event.client_payload.text }}
          DISCORD_USERNAME: ${{ github.event.client_payload.username }}
