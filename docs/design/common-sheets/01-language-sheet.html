<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>언어 변경 시트 - 인생스포 (공용 시트 시안 · OptionSheet 1/3)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="sheets.css">
</head>
<body class="ov">
<!-- 뒤 화면: 헤더 언어 버튼을 누른 홈 -->
<div class="bg" aria-hidden="true">
  <header class="hd">
    <a class="logo" href="#">인생스포</a>
    <div>
      <button class="ic" type="button" tabindex="-1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
      <button class="ic" type="button" tabindex="-1"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    </div>
  </header>
  <div class="pg">
    <p style="font-size:16px;font-weight:800">지수님의 인생 ⌄</p>
    <div class="ph" style="height:360px;margin-top:16px"></div>
    <div class="ph" style="height:52px;margin-top:20px;background:var(--spoiler);opacity:.8"></div>
  </div>
</div>
<div class="dim"></div>

<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
  <span class="handle" aria-hidden="true"></span>
  <div class="sh-head">
    <div>
      <p class="eyebrow" aria-hidden="true">LANGUAGE</p>
      <h2 class="sh-title" id="t">언어 변경</h2>
    </div>
    <button class="x" type="button" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>

  <div class="list" role="listbox" aria-labelledby="t">
    <button class="row" type="button" role="option" aria-selected="true" lang="ko"><span class="lbl">한국어</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ff8fb1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></button>
    <button class="row" type="button" role="option" aria-selected="false" lang="en"><span class="lbl">English</span></button>
    <button class="row" type="button" role="option" aria-selected="false" lang="ja"><span class="lbl">日本語</span></button>
  </div>
</div>
</body>
</html>
