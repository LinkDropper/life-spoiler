<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>외부 브라우저 안내 - 인생스포 (공용 시트 시안 · BrowserRedirect 1/2)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="sheets.css">
</head>
<body class="gate" role="dialog" aria-modal="true" aria-labelledby="t" aria-describedby="d">
<!-- 아래 막대는 카카오톡 인앱 브라우저가 그리는 상단 바(시안 맥락용). 우측 ⋯ 가 안내 문구의 그 메뉴다 -->
<div class="inapp" aria-hidden="true">
  <span>life-spoiler.com</span>
  <span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="#fff"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>
</div>

<main>
  <p class="eyebrow" aria-hidden="true">OPEN IN BROWSER</p>
  <h1 id="t">외부 브라우저에서 열기</h1>
  <p class="desc" id="d">더 나은 사용 경험을 위해<b>Chrome 또는 Safari에서 열어주세요.</b></p>

  <button class="btn" type="button" autofocus>외부 브라우저로 열기</button>

  <p class="help">자동으로 열리지 않는 경우,<br>우측 상단 ⋯ 메뉴에서<br>"Chrome으로 열기" 또는 "Safari로 열기"를 선택해주세요.</p>
</main>
</body>
</html>
