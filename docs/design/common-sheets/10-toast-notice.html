<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>앱 안 알림, 안내 - 인생스포 (공용 시트 시안 · alert 대체 2/2)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="sheets.css">
</head>
<body>
<!-- 뒤 화면: /profiles. 프로필을 고르지 않고 운세 버튼을 눌렀다. 비모달이라 배경은 흐리지 않는다 -->
<header class="hd">
  <a class="logo" href="#">인생스포</a>
  <div>
    <button class="ic" type="button" aria-label="언어 변경"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
    <button class="ic" type="button" aria-label="메뉴 열기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
</header>
<main class="pg">
  <h1 style="font-size:28px">프로필</h1>
  <div style="margin-top:16px;border-top:1px solid var(--line)">
    <div class="pl"><span>지수<small>1994.03.12 · 14 : 30 · 양력 · 여성</small></span></div>
    <div class="pl"><span>민준<small>1992.11.03 · 시간 모름 · 음력 · 남성</small></span></div>
    <div class="pl"><span>서연<small>1996.07.21 · 09 : 10 · 양력 · 여성</small></span></div>
  </div>
  <div class="btns">
    <button class="btn" type="button">인생 운세 보기</button>
    <button class="btn ghost" type="button">올해 운세 보기</button>
  </div>
</main>

<!-- 안내: role=status. 3초 뒤 자동으로 사라진다. 닫기 버튼 없이 한 줄 -->
<div class="toast" role="status" aria-live="polite" style="align-items:center;padding-right:16px">
  <div class="tx">
    <span class="tag" aria-hidden="true">NOTICE</span>
    <b>프로필을 선택해주세요.</b>
  </div>
</div>
</body>
</html>
