<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 v4 C · 오늘 + 진열장</title>
<style>
  :root { --night: #0e1222; --text: #f5f3f7; --sub: #aeabbd; --brand: #ffccd9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
  .hd { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; }
  .logo { font-size: 18px; font-weight: 800; color: var(--brand); }
  .me { display: flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--sub); }

  /* 오늘의 운세: 매일 오는 이유라 맨 위, 한 칸 전체 */
  .today { position: relative; display: block; margin: 12px 16px 0; min-height: 168px; padding: 22px 20px;
    border-radius: 24px; overflow: hidden; background: color-mix(in srgb, #d9b3f2 18%, var(--night)); }
  .today img { position: absolute; right: -8px; top: 50%; width: 168px; height: 168px; transform: translateY(-50%); object-fit: contain; }
  .today .date { font-size: 14px; color: #d9b3f2; font-weight: 600; }
  .today .t { margin-top: 6px; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; max-width: 180px; }
  .today .d { margin-top: 8px; font-size: 14px; line-height: 1.45; color: var(--sub); max-width: 170px; }

  h1 { margin: 36px 20px 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }

  /* 나머지 7개: 상자 없이 오브젝트만 놓인 3열 진열장 */
  .shelf { list-style: none; margin: 0; padding: 0 12px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); row-gap: 8px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 12px; border-radius: 18px; text-align: center; }
  .cell:active { background: rgba(255,255,255,0.04); }
  .stage { position: relative; width: 88px; height: 88px; }
  /* 별자리: 친구와 함께 하는 무료 기능이라 진열장 아래 가로 한 칸 */
  .friend { position: relative; display: block; margin: 20px 16px 0; min-height: 96px; padding: 20px; padding-right: 150px;
    border-radius: 20px; overflow: hidden; background: color-mix(in srgb, #9fd6e8 14%, var(--night)); }
  .friend img { position: absolute; right: 4px; top: 50%; width: 150px; height: 110px; transform: translateY(-50%); object-fit: contain; }
  .friend .n { display: block; font-size: 17px; }
  .friend .s { display: block; margin-top: 4px; font-size: 13.5px; }
  .stage img { position: relative; width: 100%; height: 100%; object-fit: contain; transform: scale(var(--s, 1)); }
  .n { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .s { font-size: 12.5px; color: var(--sub); line-height: 1.35; }
  .free { color: var(--hue); font-weight: 600; }
  .face { -webkit-mask-image: linear-gradient(to bottom, #000 65%, transparent 95%); mask-image: linear-gradient(to bottom, #000 65%, transparent 95%); }
</style>
</head>
<body>
<div class="page">
  <header class="hd"><span class="logo">인생스포</span><a class="me" href="#">내 프로필</a></header>

  <a class="today" href="#">
    <img src="img/daily.png" alt="">
    <span class="date" style="display:block">11월 21일 금요일</span>
    <span class="t" style="display:block">오늘의 운세</span>
    <span class="d" style="display:block">무료로 매일 자정에 새로 열려요</span>
  </a>

  <h1>다른 스포일러 고르기</h1>
  <ul class="shelf">
    <li><a class="cell" href="#" style="--hue:#f59e95; --s:1.1"><span class="stage"><img src="img/lifetime.png" alt=""></span><span class="n">인생 운세</span><span class="s">99세까지의 흐름</span></a></li>
    <li><a class="cell" href="#" style="--hue:#b7a6f2; --s:1.45"><span class="stage"><img src="img/yearly.png" alt=""></span><span class="n">올해 운세</span><span class="s">2026년 공략법</span></a></li>
    <li><a class="cell" href="#" style="--hue:#8ccbf3; --s:1.45"><span class="stage"><img src="img/next.png" alt=""></span><span class="n">내년 운세</span><span class="s">2027년 미리 보기</span></a></li>
    <li><a class="cell" href="#" style="--hue:#f2c29b; --s:0.8"><span class="stage"><img src="img/compat.png" alt=""></span><span class="n">궁합 운세</span><span class="s">둘 사이의 흐름</span></a></li>
    <li><a class="cell" href="#" style="--hue:#b49ae6; --s:1.0"><span class="stage"><img src="img/past.png" alt=""></span><span class="n">전생 운세</span><span class="s">전생의 나</span></a></li>
    <li><a class="cell" href="#" style="--hue:#e8c3a6; --s:0.85"><span class="stage"><img class="face" src="img/face.png" alt=""></span><span class="n">관상 운세</span><span class="s">사진 한 장으로</span></a></li>
  </ul>
  <a class="friend" href="#" style="--hue:#9fd6e8">
    <img src="img/universe.png" alt="">
    <span class="n">나만의 별자리 <span class="free" style="font-size:13px">무료</span></span>
    <span class="s">링크 하나로 친구들과 궁합 보기</span>
  </a>
</div>
</body>
</html>
