<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 v4 A · 오브젝트 진열</title>
<style>
  :root {
    --night: #0e1222;
    --text: #f5f3f7;
    --sub: #aeabbd;
    --brand: #ffccd9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--night); color: var(--text);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .page { max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .hd { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 20px; }
  .logo { font-size: 18px; font-weight: 800; color: var(--brand); letter-spacing: -0.01em; }
  .me { display: flex; align-items: center; min-height: 44px; font-size: 14px; color: var(--sub); }
  h1 { margin: 20px 20px 20px; font-size: 24px; line-height: 1.35; font-weight: 700; letter-spacing: -0.02em; }

  .shelf { list-style: none; margin: 0; padding: 0 16px 48px; display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .item { position: relative; display: flex; flex-direction: column; justify-content: flex-end;
    min-height: 176px; padding: 16px; border-radius: 22px; overflow: hidden;
    background: color-mix(in srgb, var(--hue) 15%, var(--night)); }
  .item img { position: absolute; top: -6px; right: -10px; width: 120px; height: 120px;
    object-fit: contain; transform: scale(var(--s, 1)); transform-origin: 70% 30%; pointer-events: none; }
  .title { position: relative; font-size: 17px; font-weight: 700; letter-spacing: -0.01em; color: var(--text); }
  .free { margin-left: 6px; font-size: 13px; font-weight: 600; color: var(--hue); }
  .desc { position: relative; margin-top: 4px; font-size: 13.5px; line-height: 1.45; color: var(--sub); }

  .span { grid-column: 1 / -1; }
  /* 관상: 평면 인물화라 머리·어깨만 남기고 아래를 부드럽게 지운다 (3D 오브젝트로 교체 전 임시) */
  .item img.face { top: 4px; right: -4px; width: 112px; height: 112px;
    -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 92%);
    mask-image: linear-gradient(to bottom, #000 62%, transparent 92%); }
  /* 인생 운세: 유일한 가로 칸. 가장 많이 사는 본편 */
  .wide { grid-column: 1 / -1; min-height: 132px; padding-right: 150px; justify-content: center; }
  .wide img { top: 50%; right: 8px; width: 140px; height: 140px; transform: translateY(-50%) scale(var(--s, 1)); transform-origin: center; }
  .wide .title { font-size: 20px; }
</style>
</head>
<body>
<div class="page">
  <header class="hd"><span class="logo">인생스포</span><a class="me" href="#">내 프로필</a></header>
  <h1>어떤 스포일러부터<br>볼까요?</h1>
  <ul class="shelf">
    <li class="span"><a class="item wide" href="#" style="--hue:#f59e95; --s:1.25">
      <img src="img/lifetime.png" alt="">
      <span class="title">인생 운세</span>
      <span class="desc">타고난 기질부터 99세까지의 흐름, 내 사용 설명서</span></a></li>
    <li><a class="item" href="#" style="--hue:#d9b3f2; --s:1.3">
      <img src="img/daily.png" alt="">
      <span class="title">오늘의 운세<span class="free">무료</span></span>
      <span class="desc">매일 자정에 바뀌어요</span></a></li>
    <li><a class="item" href="#" style="--hue:#b7a6f2; --s:1.6">
      <img src="img/yearly.png" alt="">
      <span class="title">올해 운세</span>
      <span class="desc">2026년 공략법</span></a></li>
    <li><a class="item" href="#" style="--hue:#8ccbf3; --s:1.6">
      <img src="img/next.png" alt="">
      <span class="title">내년 운세</span>
      <span class="desc">2027년 미리 보기</span></a></li>
    <li><a class="item" href="#" style="--hue:#f2c29b; --s:1.0">
      <img src="img/compat.png" alt="">
      <span class="title">궁합 운세</span>
      <span class="desc">둘 사이의 흐름</span></a></li>
    <li><a class="item" href="#" style="--hue:#b49ae6; --s:1.05">
      <img src="img/past.png" alt="">
      <span class="title">전생 운세</span>
      <span class="desc">전생의 나 만나기</span></a></li>
    <li><a class="item" href="#" style="--hue:#e8c3a6; --s:0.9">
      <img class="face" src="img/face.png" alt="">
      <span class="title">관상 운세</span>
      <span class="desc">사진 한 장으로</span></a></li>
    <li class="span"><a class="item wide" href="#" style="--hue:#9fd6e8; --s:1.45">
      <img src="img/universe.png" alt="">
      <span class="title">나만의 별자리<span class="free">무료</span></span>
      <span class="desc">링크 하나로 친구들과 궁합 보기</span></a></li>
  </ul>
</div>
</body>
</html>
