<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>홈 · 지난 상영작(2026) 시안 · 한눈에 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{--night:#0e1222;--text:#f5f3f7;--sub:#aeabbd;--brand:#ffccd9;--line:rgba(255,204,217,.25)}
  *{box-sizing:border-box}
  body{margin:0;background:#070a14;color:var(--text);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
  .wrap{max-width:1640px;margin:0 auto;padding:40px 24px 80px}
  h1{margin:0;font-size:28px;letter-spacing:-.02em}
  h2{margin:56px 0 0;font-size:20px;letter-spacing:-.01em}
  .frames{display:flex;flex-wrap:wrap;align-items:flex-start;gap:32px;margin-top:20px}
  figure{margin:0;width:375px}
  figcaption{margin-bottom:10px;font-size:14px;font-weight:700}
  figcaption span{display:block;margin-top:2px;font-weight:400;color:var(--sub);font-size:13px;line-height:1.5}
  iframe{display:block;width:375px;border:1px solid var(--line);border-radius:20px;background:var(--night)}
</style>
</head>
<body>
<div class="wrap">

<h1>홈 · 지난 상영작(2026)</h1>

<h2>안 1 · 불 꺼진 선반</h2>
<div class="frames">
  <figure><figcaption>1 · 2026 결제한 프로필 (민지)<span>진열장 아래, 불 꺼진 선반 한 칸에 2026이 보관돼요</span></figcaption><iframe src="1-dark-shelf-paid.html" title="안 1 결제" style="height:1040px" scrolling="no" loading="eager"></iframe></figure>
  <figure><figcaption>1 · 결제 안 한 프로필 (서연)<span>선반 자체가 없어요. 2026은 새로 팔지 않아요</span></figcaption><iframe src="1-dark-shelf-unpaid.html" title="안 1 미결제" style="height:870px" scrolling="no" loading="eager"></iframe></figure>
</div>

<h2>안 2 · 엔딩 크레딧</h2>
<div class="frames">
  <figure><figcaption>2 · 2026 결제한 프로필 (민지)<span>2027이 맨 앞 넓은 칸, 지난 해는 페이지 맨 끝 자막 한 줄</span></figcaption><iframe src="2-credits-paid.html" title="안 2 결제" style="height:1120px" scrolling="no" loading="eager"></iframe></figure>
  <figure><figcaption>2 · 결제 안 한 프로필 (서연)<span>자막 줄이 없어요</span></figcaption><iframe src="2-credits-unpaid.html" title="안 2 미결제" style="height:990px" scrolling="no" loading="eager"></iframe></figure>
  <figure><figcaption>2 · "지난 상영작 1편 보기"를 누르면<span>바텀시트에 지난 회차가 쌓여요</span></figcaption><iframe src="2-credits-sheet.html" title="안 2 시트" style="height:812px" scrolling="no" loading="eager"></iframe></figure>
</div>

<h2>안 3 · 스틸 보관함</h2>
<div class="frames">
  <figure><figcaption>3 · 2026 결제한 프로필 (민지)<span>진열장 6번째 칸이 "지난 상영작", 인화본이 겹쳐 있어요</span></figcaption><iframe src="3-stills-paid.html" title="안 3 결제" style="height:870px" scrolling="no" loading="eager"></iframe></figure>
  <figure><figcaption>3 · 결제 안 한 프로필 (서연)<span>같은 칸이 비어 있고, 누르면 빈 보관함이 열려요</span></figcaption><iframe src="3-stills-unpaid.html" title="안 3 미결제" style="height:870px" scrolling="no" loading="eager"></iframe></figure>
  <figure><figcaption>3 · 보관함 화면 (민지)<span>상영이 끝난 회차가 스틸컷으로 쌓여요</span></figcaption><iframe src="3-stills-page.html" title="안 3 보관함" style="height:812px" scrolling="no" loading="eager"></iframe></figure>
  <figure><figcaption>3 · 보관함 화면 (서연)<span>비어 있는 보관함, 출구는 내년 운세</span></figcaption><iframe src="3-stills-page-empty.html" title="안 3 빈 보관함" style="height:812px" scrolling="no" loading="eager"></iframe></figure>
</div>

</div>
</body>
</html>
