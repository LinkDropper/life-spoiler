<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>홈 프로필 셀렉트 · 선택 중인 프로필 삭제 확인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="home.css">
</head>
<body class="ov">
<div class="bg" aria-hidden="true">
  <header class="hd"><span class="logo">인생스포</span><span class="me">내 프로필</span></header>
  <div class="pick" style="margin-top:4px">
    <span class="who"><span class="nm"><span class="n">민지</span><span class="s">님의 스포일러</span></span><span class="bd">1995.03.14</span></span>
  </div>
  <div class="today"><img src="../home-v4/img/daily.png" alt=""><span class="date">11월 24일 화요일</span><span class="t">오늘의 운세</span><span class="d">무료로 매일 자정에 새로 열려요</span></div>
</div>
<div class="dim"></div>

<!-- common-sheets/04 문법 그대로: 취소가 기본(연핑크, 초기 포커스), 삭제하기는 테두리 버튼.
     홈 선택값이 바뀌는 경우만 대상 줄 아래에 "이후" 줄을 하나 더 둔다 -->
<div class="sheet" role="alertdialog" aria-modal="true" aria-labelledby="t" aria-describedby="d">
  <span class="handle" aria-hidden="true"></span>
  <div class="sh-head">
    <div>
      <p class="eyebrow" aria-hidden="true">DELETE</p>
      <h2 class="sh-title" id="t">정말 삭제하시겠어요?</h2>
    </div>
  </div>
  <p class="desc" id="d">삭제 후에는 복구가 불가능합니다. 선택한 프로필의 운세 기록도 모두 삭제됩니다.</p>
  <dl class="kv">
    <div><dt>삭제할 프로필</dt><dd>민지</dd></div>
    <div style="border-top:1px solid var(--line-soft)"><dt>삭제 후 홈</dt><dd>서연님의 스포일러</dd></div>
  </dl>
  <div class="btns">
    <button class="btn" type="button" autofocus>취소</button>
    <button class="btn ghost" type="button">삭제하기</button>
  </div>
</div>
</body>
</html>
