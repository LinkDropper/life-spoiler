<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>홈 프로필 셀렉트 · 시트 편집 모드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="home.css">
</head>
<body class="ov">
<div class="bg" aria-hidden="true">
  <header class="hd"><span class="logo">인생스포</span><span class="me">내 프로필</span></header>
  <div class="pick" style="margin-top:4px">
    <span class="who"><span class="nm"><span class="n">민지</span><span class="s">님의 스포일러</span></span><span class="bd">1995.03.14</span></span>
    <span class="chev"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(180deg)"><path d="m6 9 6 6 6-6"/></svg></span>
  </div>
  <div class="today"><img src="../home-v4/img/daily.png" alt=""><span class="date">11월 24일 화요일</span><span class="t">오늘의 운세</span><span class="d">무료로 매일 자정에 새로 열려요</span></div>
  <p class="shelf-h">다른 스포일러 고르기</p>
</div>
<div class="dim"></div>

<!-- 편집 모드: 제목이 "프로필 편집"으로 바뀌고 X 대신 "완료" 하나만 남긴다(출구 하나).
     선택 체크와 "프로필 추가"는 숨긴다 — 이 모드의 일은 삭제 하나뿐. 행을 눌러도 선택되지 않는다 -->
<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="t">
  <span class="handle" aria-hidden="true"></span>
  <div class="sh-head">
    <div>
      <p class="eyebrow" aria-hidden="true">EDIT</p>
      <h2 class="sh-title" id="t">프로필 편집</h2>
    </div>
    <div class="sh-act"><button class="tbtn" type="button" autofocus>완료</button></div>
  </div>

  <ul class="list" style="list-style:none">
    <li class="row ed"><span class="lbl"><span class="nm">민지</span><span class="mt">1995.03.14</span></span><button class="del" type="button" aria-label="민지 프로필 삭제">삭제</button></li>
    <li class="row ed"><span class="lbl"><span class="nm">서연</span><span class="mt">2001.11.02</span></span><button class="del" type="button" aria-label="서연 프로필 삭제">삭제</button></li>
    <li class="row ed"><span class="lbl"><span class="nm">준호</span><span class="mt">1992.07.28</span></span><button class="del" type="button" aria-label="준호 프로필 삭제">삭제</button></li>
  </ul>
</div>
</body>
</html>
