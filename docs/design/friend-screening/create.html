<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=375, initial-scale=1">
<title>시사회 열기 - 인생스포 (시안 v2)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:"SB AggroOTF";src:url("SB-B.otf") format("opentype");font-display:swap}
:root{--night:#0c1220;--haze:rgba(255,255,255,.72);--faint:rgba(255,255,255,.5);--line:rgba(255,255,255,.14);--spoiler:#ffccd9;--accent:#ff8fb1;--star:#ffe7a3;--ink:#23142d;--paper:#f9ecf0;--rose:#8a2f55;--field:#121a30;--display:"SB AggroOTF","Pretendard Variable",Pretendard,sans-serif}
*{box-sizing:border-box}
html{background:var(--night)}
body{width:375px;margin:0 auto;background:var(--night);color:#fff;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,p,ul,ol{margin:0;padding:0}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--star);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hd{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 8px 0 20px}
.logo{font-family:var(--display);font-size:24px;line-height:1;color:var(--spoiler)}
.hd div{display:flex}
.ic{display:grid;place-items:center;width:44px;height:44px;border:0;background:none}
main{padding:12px 20px 56px}
h1{font-family:var(--display);font-size:32px;line-height:1.2;font-weight:400;word-break:keep-all;overflow-wrap:anywhere}
h2{font-family:var(--display);font-size:24px;line-height:1.3;font-weight:400}
.lead{margin-top:8px;font-size:15px;line-height:1.55;color:var(--haze)}
/* 스크린 + 좌석 배치도 (로그인 SeatMap과 같은 문법) */
.map{display:flex;flex-direction:column;align-items:center;margin-top:24px}
.scr{position:relative;width:88%;height:34px;border-top:3px solid rgba(255,231,200,.85);border-radius:50% 50% 0 0/100% 100% 0 0;filter:drop-shadow(0 0 10px rgba(255,220,190,.55))}
.scr::after{content:"";position:absolute;top:4px;left:-10%;right:-10%;height:150px;background:radial-gradient(ellipse 50% 100% at 50% 0,rgba(255,226,200,.16),transparent 75%);pointer-events:none}
.scl{position:relative;margin-top:8px;font-size:10px;font-weight:700;letter-spacing:.3em;color:var(--faint)}
.rows{display:flex;flex-direction:column;gap:0;margin-top:14px}
.row{display:flex;align-items:center;gap:5px;min-height:44px;padding:0 2px;border-radius:10px;color:inherit;text-decoration:none}
a.row .rl{color:var(--accent)}
a.row:hover,a.row:active{background:rgba(255,204,217,.08)}
a.row:focus-visible{outline:2px solid var(--star);outline-offset:1px}
.cr li{scroll-margin-top:16px}
.cr li:target>.rw{background:rgba(255,204,217,.08)}
.rl{width:14px;font-size:11px;font-weight:700;color:var(--faint);text-align:center}
.s{display:grid;place-items:center;width:30px;height:26px;border-radius:7px 7px 3px 3px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);font-size:12px;font-style:normal;font-weight:700;color:#fff}
.leg{margin-top:14px;font-size:13px;text-align:center;color:var(--haze)}
/* 폼 */
.form{display:flex;flex-direction:column;gap:20px;margin-top:32px}
.fl > label:not(.chk),.fl .lb{display:block;margin-bottom:8px;font-size:14px;font-weight:700;color:rgba(255,255,255,.8)}
input[type=text]{display:block;width:100%;height:52px;padding:0 16px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:16px;color:#fff}
input::placeholder{color:rgba(255,255,255,.55)}
.hint{margin-top:8px;font-size:13px;line-height:1.5;color:rgba(255,255,255,.6)}
.chk{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;color:rgba(255,255,255,.8)}
.chk input,.opt input{-webkit-appearance:none;appearance:none;flex:none;margin:0}
.chk input{width:22px;height:22px;border:2px solid rgba(255,255,255,.5);border-radius:6px;background:var(--field)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--field);font-size:15px}
.opt input{width:20px;height:20px;border:2px solid rgba(255,255,255,.5);border-radius:50%}
.opt input:checked{border-color:var(--spoiler);background:radial-gradient(circle,var(--spoiler) 0 4px,transparent 5px)}
.opt:has(input:checked){border-color:var(--spoiler);background:rgba(255,204,217,.08)}
.pp{display:flex;align-items:center;justify-content:flex-end;min-height:44px;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--haze)}
.note{padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.5;color:var(--haze)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;padding:0 16px;border:0;border-radius:12px;background:var(--spoiler);color:var(--ink);font-family:inherit;font-size:17px;font-weight:800;line-height:1.3;cursor:pointer}
</style>
</head>
<body>
<header class="hd">
  <a class="logo" href="#" aria-label="인생스포 홈">인생스포</a>
  <div>
    <button class="ic" type="button" aria-label="언어 선택"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg></button>
    <button class="ic" type="button" aria-label="메뉴 열기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  </div>
</header>

<main>
  <h1>내 인생 영화 시사회를 열어요</h1>
  <p class="lead">친구를 초대하면 궁합 점수를 바로 보여 드려요</p>

  <div class="map">
    <div class="scr" aria-hidden="true"></div>
    <span class="scl" aria-hidden="true">SCREEN</span>
    <div class="rows" role="img" aria-label="빈 좌석 배치도. 친구가 입장하면 점수에 따라 이 자리에 앉아요.">
      <div class="row"><span class="rl">A</span><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
      <div class="row"><span class="rl">B</span><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
      <div class="row"><span class="rl">C</span><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
      <div class="row"><span class="rl">D</span><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
      <div class="row"><span class="rl">E</span><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
      <div class="row"><span class="rl">F</span><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i><i class="s"></i></div>
    </div>
  </div>
  <p class="leg">친구를 초대하면 이 자리에 앉아요. 궁합 점수가 높을수록 스크린 가까이 앉아요.</p>

  <form class="form" onsubmit="return false">
    <div class="fl">
      <label for="dn">표시 이름 (선택)</label>
      <input id="dn" type="text" placeholder="친구들에게 보여줄 이름">
    </div>
    <div class="fl">
      <label for="bd">생년월일</label>
      <input id="bd" type="text" inputmode="numeric" placeholder="YYYY-MM-DD">
    </div>
    <div class="fl">
      <label for="bt">태어난 시간</label>
      <input id="bt" type="text" inputmode="numeric" placeholder="HH:MM">
      <p class="hint">시간을 넣으면 친구들 결과가 더 뚜렷하게 갈려요. 몰라도 진행할 수 있어요.</p>
      <label class="chk"><input type="checkbox">시간 모름</label>
    </div>
    <div class="fl" role="radiogroup" aria-labelledby="cal">
      <span class="lb" id="cal">달력</span>
      <div class="seg">
        <label class="opt"><input type="radio" name="cal" checked>양력</label>
        <label class="opt"><input type="radio" name="cal">음력</label>
      </div>
    </div>
    <div class="fl" role="radiogroup" aria-labelledby="gd">
      <span class="lb" id="gd">성별</span>
      <div class="seg">
        <label class="opt"><input type="radio" name="gd" checked>여자</label>
        <label class="opt"><input type="radio" name="gd">남자</label>
      </div>
    </div>
    <p class="note">이 링크는 다시 찾을 수 없어요. 만든 뒤 꼭 저장하거나 공유해두세요.</p>
    <div>
      <label class="chk"><input type="checkbox">개인정보 수집·이용 동의 (필수)</label>
      <a class="pp" href="#">개인정보처리방침 보기</a>
    </div>
    <button class="btn" type="submit">시사회 열기</button>
  </form>
</main>
</body>
</html>
